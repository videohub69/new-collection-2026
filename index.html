<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #07070a;
            color: #ececf1;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: 10%;
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(255, 0, 85, 0.12) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
            filter: blur(100px);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 16px 40px;
            position: relative;
            z-index: 1;
        }

        /* HEADER */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            margin: 12px 0 20px;
            background: rgba(18, 18, 26, 0.65);
            backdrop-filter: blur(25px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
        }

        .brand-logo i {
            color: #ff0055;
            font-size: 24px;
            filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.8));
        }

        .badge-4k {
            background: linear-gradient(135deg, #ff0055, #ff3300);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 5px;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #ff3366;
            background: rgba(255, 0, 85, 0.1);
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 0, 85, 0.2);
        }

        .dot-pulse {
            width: 8px;
            height: 8px;
            background: #ff0055;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0055;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* GRID LAYOUT */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* PLAYER CONTAINER */
        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
            cursor: pointer;
        }

        .player-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .audio-banner {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 85, 0.4);
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            z-index: 5;
        }

        .play-overlay-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.7) 100%);
        }

        .play-btn-glow {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff0055 0%, #d60045 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 45px rgba(255, 0, 85, 0.85);
            transition: transform 0.3s;
        }

        .player-wrapper:hover .play-btn-glow {
            transform: scale(1.08);
        }

        .play-btn-glow i {
            color: #fff;
            font-size: 30px;
            margin-left: 4px;
        }

        /* FAKE SPINNER */
        .buffering-spinner {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 12px;
        }

        .spinner-circle {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 0, 85, 0.2);
            border-top: 4px solid #ff0055;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 16px 12px;
            background: linear-gradient(0deg, rgba(7, 7, 10, 0.95) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .progress-bar-fill {
            width: 72%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500);
        }

        .controls-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 13px;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .content-title {
            font-size: 18px;
            font-weight: 800;
            margin: 14px 0 8px;
            color: #fff;
            line-height: 1.3;
        }

        .meta-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .viewer-count {
            color: #ff3366;
            font-weight: 700;
            font-size: 13px;
        }

        .chat-card {
            margin-top: 18px;
            background: rgba(18, 18, 26, 0.5);
            backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            cursor: pointer;
        }

        .chat-viewport { height: 240px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .chat-list { display: flex; flex-direction: column; gap: 8px; }

        .chat-msg {
            display: flex;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            animation: msgPop 0.3s ease-out;
        }

        @keyframes msgPop { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

        .usr-avatar-img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #ff0055;
        }

        .usr-name { font-weight: 700; font-size: 11px; color: #a0a0b0; }
        .usr-msg { font-size: 12px; color: #f0f0f5; }

        .rec-item {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            padding: 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
        }

        .rec-thumb { width: 120px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; position: relative; flex-shrink: 0; }
        .rec-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .rec-title { font-size: 12px; font-weight: 600; color: #fff; line-height: 1.3; }
    </style>
</head>
